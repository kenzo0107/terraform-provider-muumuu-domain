[tools]
go = "1.26"
golangci-lint = "2.12.2"
terraform = "1.11.4"

[tasks.fmt]
description = "Format code"
run = ["go fmt ./...", "terraform fmt -recursive ./examples/"]

[tasks.lint]
description = "Lint"
run = "golangci-lint run"

[tasks.test]
description = "Execute unit tests against an in-process fake API"
run = "go test -v -count=1 -cover ./..."

[tasks.testacc]
description = "Execute acceptance tests against the sandbox (requires MUUMUU_DOMAIN_* variables)"
run = "TF_ACC=1 go test -v -count=1 -timeout 120m -run '^TestAcc' ./internal/provider/"

[tasks.generate]
description = "Format examples and generate docs"
run = "go generate ./..."

[tasks."pr-prep"]
description = "Execute this command before you create a pull request"
depends = ["fmt", "lint", "test", "generate"]
